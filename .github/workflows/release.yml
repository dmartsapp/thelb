# A release: a tag vX.Y.Z on its release/vX.Y branch builds the Linux
# binaries, their SHA-256 sums and build-provenance attestations, after the
# same checks as every change, and publishes them with the changelog's section.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: make check
      - name: the tag is on its release branch
        run: |
          v=${GITHUB_REF_NAME#v}
          git fetch -q origin "release/v${v%.*}"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/release/v${v%.*}" || { echo "tag $GITHUB_REF_NAME is not on release/v${v%.*}"; exit 1; }

  release:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write     # the release
      id-token: write     # the attestations' signing identity
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build
        run: make dist VERSION="${GITHUB_REF_NAME#v}" COMMIT="${GITHUB_SHA::7}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/thelb-*
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          make notes VERSION="${GITHUB_REF_NAME#v}" > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* --title "theLB $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
