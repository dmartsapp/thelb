# A release, and the only workflow that builds: a tag vX.Y.Z on its
# release/vX.Y branch. Nothing runs for a branch push, a pull request or a push
# to main - documentation goes to main as it is written. The end-to-end test is
# not run here: it runs on a development machine before the tag (make e2e, or
# make remote-e2e REMOTE=<host>; see docs/src/tech-release.md).
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The tag is on its release branch
        run: |
          v=${GITHUB_REF_NAME#v}
          branch="release/v${v%.*}"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch" || { echo "tag $GITHUB_REF_NAME is not on $branch"; exit 1; }
      - name: The tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: make check
        run: make check
      - name: The scripts' and the documentation's checks
        run: |
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 -B docs/build.py --check

  build:
    name: build (${{ matrix.arch }})
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write      # the attestations' signing identity
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm
            goarm: '7'
          - arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        id: build
        env:
          GOARM: ${{ matrix.goarm }}
        run: |
          make dist-one VERSION="${GITHUB_REF_NAME#v}" COMMIT="${GITHUB_SHA::7}" ARCH="${{ matrix.arch }}"
          echo "file=dist/thelb-${GITHUB_REF_NAME#v}-linux-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
      # A signed statement that this exact file was built by this workflow from
      # this commit: gh attestation verify <file> --repo dmartsapp/thelb
      - name: Attest the build's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.file }}
      - name: The SHA-256 checksum
        env:
          FILE: ${{ steps.build.outputs.file }}
        run: cd dist && sha256sum "$(basename "$FILE")" > "$(basename "$FILE").sha256" && cat "$(basename "$FILE").sha256"
      # The software bill of materials, CycloneDX 1.6 and SPDX 2.3: the Go
      # release and every module the binary was built from, read from the build
      # information Go embeds in it.
      - name: The SBOMs (CycloneDX and SPDX)
        env:
          FILE: ${{ steps.build.outputs.file }}
        run: python3 -B .github/scripts/sbom.py --version "$GITHUB_REF_NAME" "$FILE"
      # Signed statements that these SBOMs describe this exact file:
      # gh attestation verify <file> --repo dmartsapp/thelb --predicate-type https://cyclonedx.org/bom
      - name: Attest the CycloneDX SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ steps.build.outputs.file }}
          sbom-path: ${{ steps.build.outputs.file }}.cdx.json
      - name: Attest the SPDX SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ steps.build.outputs.file }}
          sbom-path: ${{ steps.build.outputs.file }}.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thelb-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write      # the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: cd dist && sha256sum thelb-*-linux-amd64 thelb-*-linux-arm thelb-*-linux-arm64 > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          make notes VERSION="${GITHUB_REF_NAME#v}" > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* --title "theLB $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
