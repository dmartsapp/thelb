<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 789 898" width="789" height="898" role="img" aria-label="d1" xml:space="preserve">
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:13px;white-space:pre;fill:#c9d1d9}.bar{fill:#8b949e;font-size:12px}.p{fill:#7ee787}.c{fill:#f0f6fc;font-weight:600}.d{fill:#8b949e}.m{fill:#79c0ff}.ok{fill:#3fb950}.wa{fill:#d29922}.er{fill:#f85149}.db{fill:#bc8cff}.k{fill:#8b949e}.h{fill:#79c0ff;font-weight:600}</style>
<rect width="789" height="898" rx="8" fill="#0d1117"/>
<path d="M0 8a8 8 0 0 1 8-8h773A8 8 0 0 1 789 8v22H0z" fill="#161b22"/>
<circle cx="18" cy="15" r="5.5" fill="#ff5f57"/><circle cx="36" cy="15" r="5.5" fill="#febc2e"/><circle cx="54" cy="15" r="5.5" fill="#28c840"/>
<text class="bar" x="394" y="19.5" text-anchor="middle">d1</text>
<text x="16" y="55"><tspan class="p">$ </tspan><tspan class="c">sudo thelb generate systemd director --vip 198.18.0.10 --port 7443 --bootstrap --secret-file</tspan></text>
<text x="16" y="73">    <tspan class="c">/etc/thelb/director.secret --backend-secret-file /etc/thelb/backend.secret</tspan></text>
<text x="16" y="91"># theLB director, as `thelb generate systemd` printed it. Install it, and start it:</text>
<text x="16" y="109">#   sudo tee /etc/systemd/system/thelb-director.service &lt;this file</text>
<text x="16" y="127">#   sudo systemctl daemon-reload &amp;&amp; sudo systemctl enable --now thelb-director</text>
<text x="16" y="145">[Unit]</text>
<text x="16" y="163">Description=theLB director</text>
<text x="16" y="181">Documentation=https://dmartsapp.github.io/thelb/docs/systemd.html</text>
<text x="16" y="199">After=network-online.target</text>
<text x="16" y="217">Wants=network-online.target</text>
<text x="16" y="253">[Service]</text>
<text x="16" y="271">Type=notify</text>
<text x="16" y="289">NotifyAccess=main</text>
<text x="16" y="307">ExecStart=/usr/local/bin/thelb director --vip 198.18.0.10 --port 7443 --secret-file</text>
<text x="16" y="325">    /etc/thelb/director.secret --backend-secret-file /etc/thelb/backend.secret --bootstrap</text>
<text x="16" y="343">Restart=always</text>
<text x="16" y="361"># Longer than the other of two directors takes to stand alone after a crash -</text>
<text x="16" y="379"># the control VIP's lease (6 s unless set) and about 15 s more: back sooner,</text>
<text x="16" y="397"># with --bootstrap it could create a cluster of its own first. With a longer</text>
<text x="16" y="415"># lease, lengthen it: https://dmartsapp.github.io/thelb/docs/directors.html#two-directors</text>
<text x="16" y="433">RestartSec=30</text>
<text x="16" y="451">WatchdogSec=30</text>
<text x="16" y="469">TimeoutStopSec=30</text>
<text x="16" y="505"># What theLB needs - the network's administration, raw packets, a control port</text>
<text x="16" y="523"># below 1024 if it is one - and no more.</text>
<text x="16" y="541">CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BIND_SERVICE</text>
<text x="16" y="559">NoNewPrivileges=yes</text>
<text x="16" y="577">ProtectSystem=full</text>
<text x="16" y="595">ReadWritePaths=-/etc/thelb</text>
<text x="16" y="613">ProtectHome=yes</text>
<text x="16" y="631">PrivateTmp=yes</text>
<text x="16" y="649">ProtectKernelLogs=yes</text>
<text x="16" y="667">ProtectControlGroups=yes</text>
<text x="16" y="685">ProtectClock=yes</text>
<text x="16" y="703">ProtectHostname=yes</text>
<text x="16" y="721">RestrictSUIDSGID=yes</text>
<text x="16" y="739">RestrictRealtime=yes</text>
<text x="16" y="757">RestrictNamespaces=yes</text>
<text x="16" y="775">LockPersonality=yes</text>
<text x="16" y="793">MemoryDenyWriteExecute=yes</text>
<text x="16" y="811">SystemCallArchitectures=native</text>
<text x="16" y="829">RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK AF_PACKET</text>
<text x="16" y="865">[Install]</text>
<text x="16" y="883">WantedBy=multi-user.target</text>
</svg>
