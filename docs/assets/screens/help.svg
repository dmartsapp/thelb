<rect width="660" height="484" rx="8" fill="#0d1117"/>
<path d="M0 8a8 8 0 0 1 8-8h644A8 8 0 0 1 660 8v22H0z" fill="#161b22"/>
<circle cx="18" cy="15" r="5.5" fill="#ff5f57"/><circle cx="36" cy="15" r="5.5" fill="#febc2e"/><circle cx="54" cy="15" r="5.5" fill="#28c840"/>
<text class="bar" x="330" y="19.5" text-anchor="middle">d1</text>
<text x="16" y="55"><tspan class="p">$ </tspan><tspan class="c">thelb --help</tspan></text>
<text x="16" y="73">theLB - The Load Balancer: L4 load balancing for Linux, in one binary.</text>
<text x="16" y="109">Usage:</text>
<text x="16" y="127">  thelb &lt;command&gt; [flags]</text>
<text x="16" y="163">Commands:</text>
<text x="16" y="181">  director   run this node as a director</text>
<text x="16" y="199">  backend    run this node as a backend</text>
<text x="16" y="217">  status     show the cluster, from the theLB running on this node</text>
<text x="16" y="235">  doctor     check this node for theLB, and say what to do</text>
<text x="16" y="253">  offer      on a backend: offer an application to the cluster, or withdraw it</text>
<text x="16" y="271">  generate   print a file's content, and write nothing: secret, commands,</text>
<text x="16" y="289">             systemd, sysctl, modules</text>
<text x="16" y="307">  admin      change the cluster, on a director: approve, refuse, remove,</text>
<text x="16" y="325">             pool, service, assign, unassign, lease, secret show</text>
<text x="16" y="361">Every command runs only as root (effective user ID 0); this help and --version</text>
<text x="16" y="379">run for anyone.</text>
<text x="16" y="415">  thelb &lt;command&gt; --help   a command's flags</text>
<text x="16" y="433">  thelb --version          the version, the commit, Go and the platform</text>
<text x="16" y="469">The documentation: https://dmartsapp.github.io/thelb/</text>
</svg>
