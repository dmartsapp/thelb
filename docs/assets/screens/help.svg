<circle cx="18" cy="15" r="5.5" fill="#ff5f57"/><circle cx="36" cy="15" r="5.5" fill="#febc2e"/><circle cx="54" cy="15" r="5.5" fill="#28c840"/>
<text class="bar" x="338" y="19.5" text-anchor="middle">d1</text>
<text x="16" y="55"><tspan class="p">$ </tspan><tspan class="c">thelb --help</tspan></text>
<text x="16" y="73">Usage: thelb &lt;command&gt; [&lt;subcommand&gt;] [options]</text>
<text x="16" y="109">theLB - The Load Balancer: L4 load balancing for Linux, in one binary.</text>
<text x="16" y="145">Commands:</text>
<text x="16" y="163">  director    Run this node as a director</text>
<text x="16" y="181">  backend     Run this node as a backend</text>
<text x="16" y="199">  status      Show the cluster, as this node sees it</text>
<text x="16" y="217">  doctor      Check this node for theLB, and say what to fix</text>
<text x="16" y="235">  offer       Offer an application to the cluster, or withdraw it (on a backend)</text>
<text x="16" y="253">  generate    Print a file theLB needs - it writes nothing</text>
<text x="16" y="271">  admin       Change the cluster (on a director)</text>
<text x="16" y="289">  help        Show the help of a command</text>
<text x="16" y="325">Options:</text>
<text x="16" y="343">  -h, --help       Show this help</text>
<text x="16" y="361">  -v, --version    Show the version, the commit, Go and the platform</text>
<text x="16" y="397">Run 'thelb &lt;command&gt; --help' for more about a command.</text>
<text x="16" y="415">Every command but help and --version runs as root.</text>
<text x="16" y="451">Documentation: https://dmartsapp.github.io/thelb/</text>
</svg>
